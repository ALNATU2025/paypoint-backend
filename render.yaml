# Render Blueprint. You can also set these in the dashboard of your existing
# service (Environment tab). Secret values are left for you to fill in.
services:
  - type: web
    name: paypoint-backend
    runtime: node
    plan: free
    buildCommand: npm ci || npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: VTPASS_MODE
        value: live
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: VTPASS_API_KEY
        sync: false
      - key: VTPASS_PUBLIC_KEY
        sync: false
      - key: VTPASS_SECRET_KEY
        sync: false
      - key: ADMIN_API_KEY
        sync: false
